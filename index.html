  :root{

  a.setor{display:block;text-decoration:none;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:13px 14px;transition:background .12s,border-color .12s}

  <h1>Abrir Job</h1>
  <p class="sub">Escolha o setor e o formulário do board abre nesta aba.</p>
  <p class="label">Setor <b>*</b></p>
  <div class="list" id="list"></div>
</div>
<script>
  const list = document.getElementById("list");
  SETORES.forEach(s => {
    const a = document.createElement("a");
    a.className = "setor"; a.href = s.link; a.target = "_top";
    const tipos = s.tipos.length
      ? `<div class="tipos">${s.tipos.map(([t,c]) => `<span class="tipo">${t}</span>`).join("")}</div>` : "";
    a.innerHTML = `<div class="top"><span class="nome">${s.nome}</span><span class="abrir">Abrir job →</span></div>${tipos}`;
    a.addEventListener("click", e => {
      e.preventDefault();
      try { window.top.location.href = s.link; } catch (_) { window.location.href = s.link; }
    });
    list.appendChild(a);
  });
</script>
